version: 1
services:
  web:
    kind: web
    build: ./api
    health: /
    routes:
    - https://whoami.astrict.app/api
  jobs:
    kind: worker
    from: web
    command:
    - sh
    - -c
    - while true; do echo worker alive; sleep 30; done
  report:
    kind: cron
    from: web
    schedule: '*/2 * * * *'
    timeout: 5m
    command:
    - sh
    - -c
    - echo report ran at $(date -u +%FT%TZ)
  site:
    kind: static
    build:
      context: web
      command: npm run build
      output: out
    routes:
    - https://whoami.astrict.app
    public: true
  app:
    kind: static
    build:
      context: app
      command: npm run build
      output: dist
    routes:
    - https://whoami.astrict.app/app
